# ==============================================================================
# Google Cloud Build Pipeline for AEGIS-CLIMATE
# Auto-builds, tests, and deploys to Google Cloud Run (IEEE Hackathon 2026)
# ==============================================================================
steps:
  # Step 1: Run automated test suite
  - name: 'python:3.12-slim'
    id: 'run-pytest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest tests/test_phase1.py tests/test_phase5_e2e.py tests/test_phase20_docker_hardening.py tests/test_phase21_cloud_build_ci.py

  # Step 2: Build container image using Docker BuildKit
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aegis-climate:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/aegis-climate:latest'
      - '.'

  # Step 3: Push image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/aegis-climate:$COMMIT_SHA'

  # Step 4: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aegis-climate'
      - '--image=gcr.io/$PROJECT_ID/aegis-climate:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--port=8080'
      - '--set-env-vars=ENVIRONMENT=production,DEBUG=false,APP_NAME=AEGIS-CLIMATE'

images:
  - 'gcr.io/$PROJECT_ID/aegis-climate:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/aegis-climate:latest'

timeout: 1200s

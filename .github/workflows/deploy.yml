name: TERRA-SENTINEL Deployment Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-cloud-run:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    if: github.repository == 'Niss54/TERRA-SENTINEL'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Build & Deploy Container to Cloud Run
        if: env.GCP_SA_KEY != ''
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/terra-sentinel:${{ github.sha }} .
          gcloud run deploy terra-sentinel \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/terra-sentinel:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars ENVIRONMENT=production,DEBUG=false,APP_NAME=TERRA-SENTINEL
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
